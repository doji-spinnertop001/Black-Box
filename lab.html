<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Box // Lab Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060606; --fg:#ededed; --dim:#8a8a8a; --line:#232323;
  --green:#39ff7a; --amber:#ffb545; --red:#ff5d5d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;-webkit-font-smoothing:antialiased;overflow:hidden}

.term-wrap{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.term-wrap.windowed{inset:auto;top:8%;left:50%;transform:translateX(-50%);width:min(760px,94vw);height:70vh;
  border:1px solid var(--line);box-shadow:0 40px 100px rgba(0,0,0,.7)}
.term-wrap.minimized{height:auto}
.term-wrap.minimized #term{display:none}
.term-wrap.closed{display:none}

.term-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0a0a0a;user-select:none;flex-shrink:0}
.dot{width:12px;height:12px;border-radius:50%;border:none;padding:0;cursor:pointer;position:relative}
.dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
.dot:hover::after{content:attr(title);position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:10px;background:#111;border:1px solid var(--line);padding:2px 6px;white-space:nowrap;color:var(--fg);z-index:10}
.term-title{margin-left:10px;color:var(--dim);font-size:12.5px}

#term{flex:1;overflow-y:auto;padding:16px;font-size:13.5px;line-height:1.55;color:#c9ffd6}
#term .line{white-space:pre-wrap;word-break:break-word}
#term .prompt-line{display:flex;gap:8px}
#term .ps1{color:var(--green);white-space:nowrap}
#term input{background:transparent;border:none;outline:none;color:#fff;font:inherit;flex:1;min-width:0}
.err{color:var(--red)} .ok{color:var(--green)} .amb{color:var(--amber)} .muted{color:#6b6b6b}

.reopen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);font-size:13px}
.reopen.show{display:flex}
.reopen a{color:var(--green);text-decoration:underline;cursor:pointer;margin-left:6px}
</style>
</head>
<body>

<div class="term-wrap" id="termWrap">
  <div class="term-bar">
    <button class="dot r" title="Close" onclick="closeTerm()"></button>
    <button class="dot y" title="Minimize" onclick="toggleMinimize()"></button>
    <button class="dot g" title="Maximize / Restore" onclick="toggleMaximize()"></button>
    <span class="term-title">blackbox@lab:~$</span>
  </div>
  <div id="term" onclick="document.getElementById('cmdin')&&document.getElementById('cmdin').focus()"></div>
</div>
<div class="reopen" id="reopen">Terminal closed — <a onclick="openTerm()">reopen</a></div>

<script>
const term = document.getElementById('term');
const banner = `  ____  _            _   ____
 | __ )| | __ _  ___| | | __ )  _____  __
 |  _ \\| |/ _\` |/ __| | |  _ \\ / _ \\ \\/ /
 | |_) | | (_| | (__| |_| |_) | (_) >  <
 |____/|_|\\__,_|\\___|\\___|____/ \\___/_/\\_\\

Kali GNU/Linux Rolling — simulated lab shell
Sandbox target: 10.10.10.5 (lab-target.blackbox.local)
Type 'help' to list available commands.
`;
function println(html){ const d=document.createElement('div'); d.className='line'; d.innerHTML=html; term.appendChild(d); term.scrollTop=term.scrollHeight; }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function printlnRaw(text){ println(escapeHtml(text)); }

printlnRaw(banner);

const outputs = {
ping: `PING 10.10.10.5 (10.10.10.5) 56(84) bytes of data.
64 bytes from 10.10.10.5: icmp_seq=1 ttl=63 time=11.2 ms
64 bytes from 10.10.10.5: icmp_seq=2 ttl=63 time=10.8 ms
64 bytes from 10.10.10.5: icmp_seq=3 ttl=63 time=11.5 ms
--- 10.10.10.5 ping statistics ---
3 packets transmitted, 3 received, 0% packet loss, time 2003ms
rtt min/avg/max/mdev = 10.8/11.1/11.5/0.3 ms`,

fping: `10.10.10.5 is alive`,

nmap: `Starting Nmap 7.94 ( https://nmap.org )
Nmap scan report for lab-target.blackbox.local (10.10.10.5)
Host is up (0.011s latency).

PORT     STATE SERVICE    VERSION
22/tcp   open  ssh        OpenSSH 8.9p1
80/tcp   open  http       nginx 1.24.0
3306/tcp open  mysql      MySQL 8.0.34
8080/tcp open  http-proxy

Service Info: OS: Linux

Nmap done: 1 IP address (1 host up) scanned in 4.82 seconds`,

dirb: `DIRB v2.22
START_TIME: Sat Oct 4 2026
URL_BASE: http://10.10.10.5/

---- Scanning URL: http://10.10.10.5/ ----
+ http://10.10.10.5/admin (CODE:301|SIZE:178)
+ http://10.10.10.5/backup (CODE:200|SIZE:412)
+ http://10.10.10.5/login.php (CODE:200|SIZE:2103)
+ http://10.10.10.5/robots.txt (CODE:200|SIZE:52)

DOWNLOADED: 4612 - FOUND: 4`,

hping3: `HPING 10.10.10.5 (eth0 10.10.10.5): S set, 40 headers + 0 data bytes
len=44 ip=10.10.10.5 ttl=63 DF id=0 sport=80 flags=SA seq=0 win=65535 rtt=11.0 ms
len=44 ip=10.10.10.5 ttl=63 DF id=0 sport=80 flags=SA seq=1 win=65535 rtt=10.7 ms

--- 10.10.10.5 hping statistic ---
2 packets transmitted, 2 packets received, 0% packet loss
round-trip min/avg/max = 10.7/10.8/11.0 ms`,

curl: `HTTP/1.1 200 OK
Server: nginx/1.24.0
Content-Type: text/html; charset=UTF-8
Content-Length: 2103

<!DOCTYPE html><html><head><title>Lab Target Login</title></head>
<body><form action="/login.php" method="POST">...</form></body></html>`,

sqlmap: `        ___
       __H__
 ___ ___[.]_____ ___ ___  {1.8}
|_ -| . [']     | .'| . |
|___|_  [.]_|_|_|__,|  _|
      |_|V...       |_|   https://sqlmap.org

[*] starting @ 10:14:02

[10:14:02] [INFO] testing connection to the target URL
[10:14:03] [INFO] testing 'login' parameter 'user' for SQL injection
[10:14:05] [WARNING] parameter 'user' appears injectable (boolean-based blind)
[10:14:06] [INFO] confirming injection point
[10:14:07] [INFO] the back-end DBMS is MySQL
[10:14:07] [INFO] fetching database names (simulated — read-only lab mode)
available databases [2]: lab_app, information_schema`,

instaloader: `Loading session for lab_demo_account...
[simulated] no live network access from this sandbox.
Instaloader is normally used to download public Instagram
profile data, posts, and stories for OSINT research.
Example (real environment): instaloader profile_name`
};

function run(cmdRaw){
  const cmd = cmdRaw.trim();
  printlnRaw('doji@blackbox-lab:~$ ' + cmd);
  if(!cmd) return;
  const parts = cmd.split(/\s+/);
  const base = parts[0];
  if(base === 'clear'){ term.innerHTML=''; return; }
  if(base === 'help'){
    println(`<span class="amb">Available in this sandbox:</span> ping, fping, nmap, dirb, hping3, curl, sqlmap, instaloader
Add a target, e.g. 'nmap 192.168.1.1' or 'ping example.com' — it'll be reflected in the output.
This is a simulated response for learning syntax, not a live scan. Type 'clear' to clear the screen.`);
    return;
  }
  if(outputs[base]){
    const target = parts.slice(1).find(p=>!p.startsWith('-')) || '10.10.10.5';
    let txt = outputs[base].split('10.10.10.5').join(target).split('lab-target.blackbox.local').join(target);
    println(escapeHtml(txt));
    return;
  }
  println(`<span class="err">command not found or not supported in this sandbox:</span> ${escapeHtml(base)}  <span class="muted">(try 'help')</span>`);
}

function renderPrompt(){
  const row = document.createElement('div');
  row.className = 'prompt-line';
  row.innerHTML = `<span class="ps1">blackbox@lab:~$</span>`;
  const input = document.createElement('input');
  input.id='cmdin'; input.autocomplete='off'; input.spellcheck=false;
  row.appendChild(input);
  term.appendChild(row);
  input.focus();
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const val = input.value;
      row.remove();
      run(val);
      renderPrompt();
    }
  });
  term.scrollTop = term.scrollHeight;
}
renderPrompt();

// ---- Window controls ----
const termWrap = document.getElementById('termWrap');
const reopen = document.getElementById('reopen');
function closeTerm(){ termWrap.classList.add('closed'); reopen.classList.add('show'); }
function openTerm(){ termWrap.classList.remove('closed','minimized'); reopen.classList.remove('show'); const i=document.getElementById('cmdin'); i&&i.focus(); }
function toggleMinimize(){ termWrap.classList.toggle('minimized'); }
function toggleMaximize(){ termWrap.classList.remove('minimized'); termWrap.classList.toggle('windowed'); }
</script>
</body>
</html>
